server {
    listen 80;
    server_name localhost;

    # Folder tempat file build React (dist) diletakkan
    root /usr/share/nginx/html;
    index index.html index.htm;

    # =========================================================================
    # PENGGANTI ATURAN .HTACCESS (MOD_REWRITE APACHE) UNTUK NGINX:
    # try_files $uri $uri/ /index.html;
    # 
    # Jika file fisik ($uri) atau direktori ($uri/) tidak ditemukan,
    # Nginx akan meneruskan request ke /index.html sehingga React Router (SPA)
    # yang menangani rute tersebut dan halaman TIDAK AKAN 404 (Not Found) saat di-reload!
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching untuk aset statis agar loading cepat
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.html;
    }

    # Halaman error default
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
